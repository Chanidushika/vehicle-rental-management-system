<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="layout/base :: layout(~{::div.content})">
<head>
    <title>Admin Dashboard</title>
</head>
<body>
<div class="content bg-rofi-white min-h-screen py-10">
    <div class="max-w-7xl mx-auto px-4">
        
        <!-- Header -->
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-10 gap-4">
            <div>
                <h2 class="text-3xl font-black text-rofi-black tracking-tight">Platform Analytics</h2>
                <p class="text-gray-500 font-bold mt-1">Real-time overview of the RentX ecosystem.</p>
            </div>
            <div class="flex gap-3">
                <a href="/vehicles/add" class="px-5 py-2.5 bg-rofi-yellow text-rofi-black font-black rounded-lg hover:bg-yellow-500 transition-colors shadow-sm">+ Add Vehicle</a>
                <a href="/admin/users" class="px-5 py-2.5 bg-white text-rofi-black border border-gray-300 font-black rounded-lg hover:bg-gray-50 transition-colors shadow-sm">Manage Users</a>
            </div>
        </div>

        <!-- Bento Grid: Main Stats (Modeled after Trust Section Circular Icons) -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-8 mb-10 text-center">
            
            <!-- Revenue -->
            <div class="bg-white p-8 rounded-3xl shadow-sm border border-gray-200">
                <div class="w-20 h-20 mx-auto rounded-full bg-yellow-50 flex items-center justify-center mb-6 border-4 border-rofi-yellow shadow-sm">
                    <span class="text-3xl font-black text-rofi-yellow">Rs.</span>
                </div>
                <h3 class="text-xl font-bold text-gray-500 uppercase tracking-widest mb-2 text-xs">Total Revenue</h3>
                <div class="text-4xl font-black text-rofi-black">
                    LKR <span th:text="${stats.totalRevenue}">0.0</span>
                </div>
            </div>

            <!-- Bookings -->
            <div class="bg-white p-8 rounded-3xl shadow-sm border border-gray-200">
                <div class="w-20 h-20 mx-auto rounded-full bg-yellow-50 flex items-center justify-center mb-6 border-4 border-rofi-yellow shadow-sm text-rofi-yellow">
                    <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"></path></svg>
                </div>
                <h3 class="text-xl font-bold text-gray-500 uppercase tracking-widest mb-2 text-xs">Total Bookings</h3>
                <div class="text-4xl font-black text-rofi-black" th:text="${stats.totalBookings}">0</div>
            </div>

            <!-- Fleet -->
            <div class="bg-white p-8 rounded-3xl shadow-sm border border-gray-200">
                <div class="w-20 h-20 mx-auto rounded-full bg-yellow-50 flex items-center justify-center mb-6 border-4 border-rofi-yellow shadow-sm text-rofi-yellow">
                    <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"></path></svg>
                </div>
                <h3 class="text-xl font-bold text-gray-500 uppercase tracking-widest mb-2 text-xs">Total Vehicles</h3>
                <div class="text-4xl font-black text-rofi-black" th:text="${stats.totalVehicles}">0</div>
            </div>
            
        </div>

        <!-- Lower Grid -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            
            <div class="bg-white rounded-3xl shadow-sm border border-gray-200 p-8">
                <h3 class="text-rofi-black font-black text-xl mb-6">Fleet Utilization</h3>
                
                <div class="flex justify-between items-end mb-2">
                    <span class="text-4xl font-black text-rofi-black"><span th:text="${stats.totalVehicles - stats.availableVehicles}">0</span> <span class="text-xl text-gray-400 font-bold">/ <span th:text="${stats.totalVehicles}">0</span> Rented</span></span>
                </div>
                
                <div class="w-full h-4 bg-gray-100 rounded-full overflow-hidden flex my-6">
                    <div class="h-full bg-rofi-yellow" th:style="'width: ' + (${stats.totalVehicles > 0 ? ((stats.totalVehicles - stats.availableVehicles) * 100.0 / stats.totalVehicles) : 0}) + '%'"></div>
                    <div class="h-full bg-gray-200" th:style="'width: ' + (${stats.totalVehicles > 0 ? (stats.availableVehicles * 100.0 / stats.totalVehicles) : 100}) + '%'"></div>
                </div>
                
                <div class="flex justify-between text-sm font-bold text-gray-500">
                    <div class="flex items-center"><span class="w-3 h-3 rounded-full bg-rofi-yellow mr-2"></span> Rented</div>
                    <div class="flex items-center"><span class="w-3 h-3 rounded-full bg-gray-200 mr-2"></span> Available</div>
                </div>
            </div>

            <div class="space-y-8">
                <div class="bg-white rounded-3xl shadow-sm border border-gray-200 p-8 flex items-center justify-between">
                    <div>
                        <h3 class="text-gray-500 font-bold uppercase tracking-widest text-xs mb-2">Active Ongoing Rentals</h3>
                        <div class="text-4xl font-black text-rofi-black" th:text="${stats.activeBookings}">0</div>
                    </div>
                    <a href="/bookings/history" class="px-5 py-3 bg-rofi-yellow hover:bg-yellow-500 text-rofi-black font-black rounded-lg transition-colors shadow-sm">
                        Process Returns
                    </a>
                </div>

                <div class="bg-white rounded-3xl shadow-sm border border-gray-200 p-8 flex items-center justify-between">
                    <div>
                        <h3 class="text-gray-500 font-bold uppercase tracking-widest text-xs mb-2">Most Popular Category</h3>
                        <div class="text-4xl font-black text-rofi-black uppercase" th:text="${stats.mostRentedType}">N/A</div>
                    </div>
                    <div class="text-5xl">🏆</div>
                </div>
            </div>

        </div>

    </div>
</div>
</body>
</html>
